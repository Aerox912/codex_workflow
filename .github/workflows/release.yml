name: Build and publish release

on:
  push:
    branches:
      - main
    paths:
      - "codex_workflow/**"
      - "plugins/codex-workflow/**"
      - "scripts/package_release.py"
      - "scripts/test_workflow_runtime.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as a GitHub prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: codex-workflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve and validate the release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < codex_workflow/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-patch\.[1-9][0-9]*$ ]]; then
            echo "::error::Fork release version must use X.Y.Z-patch.N."
            exit 1
          fi
          release_tag="v${version}"
          asset="codex_workflow-${version}.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

          if release_assets="$(gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null)"; then
            if ! grep -Fxq "$asset" <<<"$release_assets" || \
               ! grep -Fxq "SHA256SUMS" <<<"$release_assets"; then
              echo "::error::Release $release_tag exists without the required assets."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag is already complete; nothing to publish."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin \
            "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "::error::Tag $release_tag exists without a complete release."
            exit 1
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          python -B scripts/test_workflow_runtime.py -v
          python -B codex_workflow/workflow.py validate \
            --package-root codex_workflow \
            --json
          python scripts/package_release.py \
            --release-tag "$release_tag" \
            --output-dir dist
          python scripts/package_release.py \
            --verify dist/codex_workflow-*.zip

      - name: Publish the GitHub Release
        if: steps.package.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          release_options=(--generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$MANUAL_PRERELEASE" != "false" ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/codex_workflow-*.zip \
            dist/SHA256SUMS \
            --title "codex_workflow $RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            "${release_options[@]}"

      - name: Report the published release
        if: steps.package.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
